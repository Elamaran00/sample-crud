<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Courses</ui:define>
    
    <ui:define name="content">
        <div class="card">
            <h2>Course Management</h2>
            <h:form>
                <div style="margin-bottom: 15px;">
                    <h:outputLabel for="code" value="Code: " style="font-weight:bold;" />
                    <h:inputText id="code" value="#{courseBean.currentCourse.courseCode}" style="margin-right: 10px;" />
                    
                    <h:outputLabel for="name" value="Name: " style="font-weight:bold;" />
                    <h:inputText id="name" value="#{courseBean.currentCourse.courseName}" style="margin-right: 10px;" />
                    
                    <h:outputLabel for="dept" value="Dept: " style="font-weight:bold;" />
                    <h:selectOneMenu id="dept" value="#{courseBean.selectedDepartmentId}" style="margin-right: 10px;">
                        <f:selectItems value="#{courseBean.departments}" var="dept" itemValue="#{dept.id}" itemLabel="#{dept.departmentName}" />
                    </h:selectOneMenu>
                    
                    <h:commandButton value="Save" action="#{courseBean.save}" styleClass="btn btn-success" />
                </div>
                
                <h:dataTable value="#{courseBean.courses}" var="course">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{course.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Code</f:facet>
                        #{course.courseCode}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        #{course.courseName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Department</f:facet>
                        #{course.department.departmentName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandButton value="Delete" action="#{courseBean.delete(course.id)}" styleClass="btn btn-danger" onclick="return confirm('Are you sure?');" />
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
