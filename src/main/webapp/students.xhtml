<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Students</ui:define>
    
    <ui:define name="content">
        <div class="card">
            <h2>Student Management</h2>
            <h:form>
                <div style="margin-bottom: 15px;">
                    <h:commandButton value="Add Student" action="#{studentBean.prepareCreate}" styleClass="btn btn-success" />
                </div>
                
                <h:dataTable value="#{studentBean.students}" var="student">
                    <h:column>
                        <f:facet name="header">Student ID</f:facet>
                        #{student.studentId}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        #{student.firstName} #{student.lastName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Email</f:facet>
                        #{student.email}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Phone</f:facet>
                        #{student.phone}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Department</f:facet>
                        #{student.department.departmentName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Year</f:facet>
                        #{student.yearOfStudy}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Status</f:facet>
                        #{student.status}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandButton value="View" action="#{studentBean.prepareView(student)}" styleClass="btn" style="margin-right: 5px;" />
                        <h:commandButton value="Edit" action="#{studentBean.prepareEdit(student)}" styleClass="btn" style="margin-right: 5px;" />
                        <h:commandButton value="Delete" action="#{studentBean.delete(student.id)}" styleClass="btn btn-danger" onclick="return confirm('Are you sure you want to delete this student?');" />
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
