<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Settings</ui:define>
    
    <ui:define name="content">
        <div class="card">
            <h2>Application Settings</h2>
            <p>Settings configuration panel for Student Management System.</p>
            <h:form>
                <div class="form-group">
                    <h:outputLabel for="theme" value="System Theme:" />
                    <h:selectOneMenu id="theme">
                        <f:selectItem itemValue="light" itemLabel="Light" />
                        <f:selectItem itemValue="dark" itemLabel="Dark" />
                    </h:selectOneMenu>
                </div>
                <h:commandButton value="Save Settings" styleClass="btn btn-success" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
