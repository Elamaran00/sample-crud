<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:define name="title">Departments</ui:define>
    
    <ui:define name="content">
        <div class="card">
            <h2>Department Management</h2>
            <h:form>
                <div style="margin-bottom: 15px;">
                    <h:outputLabel for="code" value="Code: " style="font-weight:bold;" />
                    <h:inputText id="code" value="#{departmentBean.currentDepartment.departmentCode}" style="margin-right: 10px;" />
                    
                    <h:outputLabel for="name" value="Name: " style="font-weight:bold;" />
                    <h:inputText id="name" value="#{departmentBean.currentDepartment.departmentName}" style="margin-right: 10px;" />
                    
                    <h:commandButton value="Save" action="#{departmentBean.save}" styleClass="btn btn-success" />
                </div>
                
                <h:dataTable value="#{departmentBean.departments}" var="dept">
                    <h:column>
                        <f:facet name="header">ID</f:facet>
                        #{dept.id}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Code</f:facet>
                        #{dept.departmentCode}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Name</f:facet>
                        #{dept.departmentName}
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandButton value="Delete" action="#{departmentBean.delete(dept.id)}" styleClass="btn btn-danger" onclick="return confirm('Are you sure?');" />
                    </h:column>
                </h:dataTable>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
