plugins {
    id 'java'
    id 'war'
}

group = 'com.example.student'
version = '1.0.0'

java {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

repositories {
    mavenCentral()
}

dependencies {
    // JSF 2.2 API and Impl - Java EE 7 generation, compiles/runs on Java 8
    compileOnly 'com.sun.faces:jsf-api:2.2.20'
    compileOnly 'com.sun.faces:jsf-impl:2.2.20'
    
    // For standalone WAR execution via Tomcat/Gretty, we need the impl at runtime
    runtimeOnly 'com.sun.faces:jsf-api:2.2.20'
    runtimeOnly 'com.sun.faces:jsf-impl:2.2.20'

    // CDI 1.2
    compileOnly 'javax.enterprise:cdi-api:1.2'
    
    // Inject
    compileOnly 'javax.inject:javax.inject:1'

    // Servlet 3.1
    compileOnly 'javax.servlet:javax.servlet-api:3.1.0'
    
    // JSTL
    implementation 'javax.servlet:jstl:1.2'

    // Java EE Annotation API (for @PostConstruct on Java 11+)
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    
    // JPA / Hibernate 5.4 (Compatible with Java 8 and JSF 2.2 / JPA 2.1)
    implementation 'org.hibernate:hibernate-core:5.4.33.Final'
    
    // H2 Database
    implementation 'com.h2database:h2:2.1.214'
}



war {
    archiveBaseName = 'StudentManagementJSF'
    archiveVersion = ''
}

compileJava {
    options.encoding = 'UTF-8'
}


